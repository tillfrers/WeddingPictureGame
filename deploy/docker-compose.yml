# Statischer Webserver fuer das SvelteKit-Frontend.
# Deployment-Ziel auf dem Server: /opt/wedding-ui/
#
# network_mode: host ist hier bewusst gewaehlt und der Kern des Setups:
# der Container teilt sich den Netzwerk-Namespace des Hosts, dadurch
#   - lauscht nginx direkt auf Host-Port 5090 (kein Port-Publishing noetig)
#   - erreicht proxy_pass 127.0.0.1:5080 den Kestrel auf dem Host-Loopback
# In einem Bridge-Netz waere 127.0.0.1 der Container selbst; das Backend
# muesste dann per ASPNETCORE_URLS auf 0.0.0.0 umgebogen werden.
services:
  wedding-ui:
    image: nginx:alpine
    container_name: wedding-ui
    restart: unless-stopped
    network_mode: host
    volumes:
      # Web-Root - Ziel des Rider-SFTP-Uploads (frontend/build)
      - /opt/weddingPictureGame.UI:/usr/share/nginx/html:ro
      # Ersetzt die Image-Default-Config, die sonst Port 80 belegen wollte.
      # Absoluter Pfad, damit der Stack auch aus Portainers Web-Editor
      # funktioniert (dort gibt es kein Verzeichnis neben der Compose-Datei).
      # Beim Umbenennen des Verzeichnisses diese Zeile mitziehen.
      - /opt/wedding-ui/site.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
