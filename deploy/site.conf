# nginx-Config fuer den wedding-ui Container.
# Wird als /etc/nginx/conf.d/default.conf gemountet und ersetzt damit die
# Default-Config des nginx:alpine-Images (die auf Port 80 lauschen wuerde).

map $http_x_forwarded_proto $forwarded_proto {
    default  $scheme;
    "~."     $http_x_forwarded_proto;
}

server {
    listen 5090;
    listen [::]:5090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handy-Fotos sind schnell 3-8 MB, das Backend erlaubt 30 MB.
    # nginx-Default sind 1 MB -> ohne diese Zeile scheitert JEDER Upload mit 413.
    # ACHTUNG: dieselbe Einstellung wird zusaetzlich in NPM gebraucht, sonst
    # blockt der vorgelagerte Proxy den Upload, bevor er hier ankommt.
    client_max_body_size 32m;

    # Bundle ist ~100 KB; lohnt sich fuer Gaeste im Mobilfunknetz.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;

    # Fuer Monitoring / Container-Healthcheck. Beantwortet ohne Backend-Kontakt.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API an Kestrel. Same-origin, deshalb braucht das Backend kein CORS.
    # Dank network_mode:host ist 127.0.0.1 hier der HOST-Loopback.
    # WICHTIG: KEIN Slash am Ende von proxy_pass - sonst wird das /api-Prefix
    # abgeschnitten und das Backend sieht /Image/... statt /api/Image/...
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Uploads streamen statt erst komplett auf Platte zu puffern
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Assets tragen einen Hash im Dateinamen -> dauerhaft cachebar
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NIE cachen, sonst sieht der Gast nach einem Redeploy die alte App
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback: /9E79 & Co. existieren nicht als Datei auf der Platte
    location / {
        try_files $uri $uri/ /index.html;
    }
}
